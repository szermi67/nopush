name: Kompilator NoPush Fabric 1.21.4
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobieranie projektu
        uses: actions/checkout@v4

      - name: Konfiguracja Javy 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Pobieranie oficjalnego szablonu Fabric z GitHub
        run: |
          # Pobieramy oficjalne srodowisko Fabric, ktore ma wbudowane wszystkie poprawne biblioteki
          git clone --depth=1 -b 1.21.4 https://github.com project
          cd project
          
          # Usuwamy domyslny kod z szablonu, aby zrobic miejsce na nasz mini-client
          rm -rf src/main/java/net/fabricmc/example/*
          rm -rf src/main/resources/assets
          
          # Konfigurujemy unikalna nazwe i ID naszego moda
          sed -i 's/"modid"/"nopush-doomsday"/g' src/main/resources/fabric.mod.json
          sed -i 's/"Example Mod"/"Mini Doomsday Client"/g' src/main/resources/fabric.mod.json
          
          # Tworzymy foldery pod nasze Mixiny i pliki GUI
          mkdir -p src/main/java/pl/serwer/nopush/mixin
          mkdir -p src/main/java/pl/serwer/nopush/gui

          # Tworzymy plik konfiguracyjny mixinow
          cat << 'EOF' > src/main/resources/nopush.mixins.json
          {
            "required": true,
            "package": "pl.serwer.nopush.mixin",
            "compatibilityLevel": "JAVA_21",
            "client": [
              "LocalPlayerMixin",
              "AntiBlindnessMixin",
              "KeyboardMixin"
            ]
          }
          EOF

          # Rejestrujemy plik mixinow w glownym configu Fabric
          sed -i 's/"modid.mixins.json"/"nopush.mixins.json"/g' src/main/resources/fabric.mod.json

          # Tworzymy klase z przelacznikami funkcji (ModSettings)
          cat << 'EOF' > src/main/java/pl/serwer/nopush/gui/ModSettings.java
          package pl.serwer.nopush.gui;
          public class ModSettings {
              public static boolean noPushActive = true;
              public static boolean antiBlindActive = true;
          }
          EOF

          # Tworzymy Mixin odpowiadajacy za NoPush
          cat << 'EOF' > src/main/java/pl/serwer/nopush/mixin/LocalPlayerMixin.java
          package pl.serwer.nopush.mixin;
          import net.minecraft.client.player.LocalPlayer;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfoReturnable;
          import pl.serwer.nopush.gui.ModSettings;
          
          @Mixin(LocalPlayer.class)
          public class LocalPlayerMixin {
              @Inject(method = "pushOutOfBlocks", at = @At("HEAD"), cancellable = true)
              private void onPushOutOfBlocks(double x, double z, CallbackInfoReturnable<Boolean> cir) {
                  if (ModSettings.noPushActive) {
                      cir.setReturnValue(false);
                  }
              }
          }
          EOF

          # Tworzymy Mixin odpowiadajacy za AntiBadEffect
          cat << 'EOF' > src/main/java/pl/serwer/nopush/mixin/AntiBlindnessMixin.java
          package pl.serwer.nopush.mixin;
          import net.minecraft.client.player.LocalPlayer;
          import net.minecraft.entity.effect.StatusEffect;
          import net.minecraft.entity.effect.StatusEffects;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfoReturnable;
          import net.minecraft.registry.entry.RegistryEntry;
          import pl.serwer.nopush.gui.ModSettings;
          
          @Mixin(LocalPlayer.class)
          public class AntiBlindnessMixin {
              @Inject(method = "hasStatusEffect", at = @At("HEAD"), cancellable = true)
              private void onHasStatusEffect(RegistryEntry<StatusEffect> effect, CallbackInfoReturnable<Boolean> cir) {
                  if (ModSettings.antiBlindActive) {
                      if (effect.value() == StatusEffects.BLINDNESS || effect.value() == StatusEffects.DARKNESS) {
                          cir.setReturnValue(false);
                      }
                  }
              }
          }
          EOF

          # Tworzymy Mixin do nasluchiwania Prawego Shifta (Klawiatura)
          cat << 'EOF' > src/main/java/pl/serwer/nopush/mixin/KeyboardMixin.java
          package pl.serwer.nopush.mixin;
          import net.minecraft.client.Keyboard;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;
          
          @Mixin(Keyboard.class)
          public class KeyboardMixin {
              @Inject(method = "onKey", at = @At("HEAD"))
              private void onKeyInput(long window, int key, int scancode, int action, int modifiers, CallbackInfo ci) {
                  // Wykrywanie klikniecia klawisza Prawy Shift (kod 344)
                  if (key == 344 && action == 1) {
                      System.out.println("[Mini Doomsday] Wykryto Prawy Shift!");
                  }
              }
          }
          EOF

          # Nadajemy uprawnienia i kompilujemy plik .jar oficjalnym skryptem gradlew
          chmod +x gradlew
          ./gradlew build
          
          # Przenosimy gotowy plik do glownego katalogu projektu, aby akcja mogla go wyslac
          mkdir -p ../build/libs
          cp build/libs/*-project.jar ../build/libs/mini-doomsday-1.0.0.jar 2>/dev/null || cp build/libs/*.jar ../build/libs/mini-doomsday-1.0.0.jar

      - name: Przesylanie gotowego pliku bota
        uses: actions/upload-artifact@v4
        with:
          name: Mini-Doomsday-JAR
          path: build/libs/mini-doomsday-1.0.0.jar
