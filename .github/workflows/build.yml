name: Kompilator NoPush Fabric 1.21.4
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobieranie projektu
        uses: actions/checkout@v4

      - name: Konfiguracja Javy 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generowanie struktury projektu Fabric
        run: |
          mkdir -p src/main/java/pl/serwer/nopush/mixin
          mkdir -p src/main/resources
          mkdir -p gradle/wrapper

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  maven { url = 'https://maven.fabricmc.net/' }
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2G
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'fabric-loom' version '1.9-SNAPSHOT'
          }
          version = '1.0.0'
          group = 'pl.serwer.nopush'
          dependencies {
              minecraft 'com.mojang:minecraft:1.21.4'
              mappings 'net.fabricmc:yarn:1.21.4+build.1:v2'
              modImplementation 'net.fabricmc:fabric-loader:0.16.9'
          }
          tasks.withType(JavaCompile).configureEach { it.options.release = 21 }
          java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
          wrapper { gradleVersion = "8.11.1" }
          EOF

      - name: Generowanie plikow konfiguracyjnych moda
        run: |
          cat << 'EOF' > src/main/resources/fabric.mod.json
          {
            "schemaVersion": 1,
            "id": "nopush-doomsday",
            "version": "1.0.0",
            "name": "No Push Doomsday",
            "description": "Wyciete moduly NoPush oraz AntiBlindness z cheata Doomsday.",
            "authors": ["Serwer"],
            "license": "MIT",
            "environment": "client",
            "mixins": ["nopush.mixins.json"],
            "depends": { "fabricloader": ">=0.16.9", "minecraft": "~1.21.4" }
          }
          EOF

          cat << 'EOF' > src/main/resources/nopush.mixins.json
          {
            "required": true,
            "package": "pl.serwer.nopush.mixin",
            "compatibilityLevel": "JAVA_21",
            "client": [
              "LocalPlayerMixin",
              "AntiBlindnessMixin"
            ]
          }
          EOF

      - name: Generowanie kodu NoPush (LocalPlayer)
        run: |
          cat << 'EOF' > src/main/java/pl/serwer/nopush/mixin/LocalPlayerMixin.java
          package pl.serwer.nopush.mixin;
          import net.minecraft.client.player.LocalPlayer;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfoReturnable;
          
          @Mixin(LocalPlayer.class)
          public class LocalPlayerMixin {
              @Inject(method = "pushOutOfBlocks", at = @At("HEAD"), cancellable = true)
              private void onPushOutOfBlocks(double x, double z, CallbackInfoReturnable<Boolean> cir) {
                  cir.setReturnValue(false);
              }
          }
          EOF

      - name: Generowanie kodu AntiBadEffect (Lightmap/Effects)
        run: |
          cat << 'EOF' > src/main/java/pl/serwer/nopush/mixin/AntiBlindnessMixin.java
          package pl.serwer.nopush.mixin;
          import net.minecraft.client.player.LocalPlayer;
          import net.minecraft.entity.effect.StatusEffects;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfoReturnable;
          
          @Mixin(LocalPlayer.class)
          public class AntiBlindnessMixin {
              @Inject(method = "hasStatusEffect", at = @At("HEAD"), cancellable = true)
              private void onHasStatusEffect(net.minecraft.entity.effect.StatusEffect effect, CallbackInfoReturnable<Boolean> cir) {
                  if (effect == StatusEffects.BLINDNESS || effect == StatusEffects.DARKNESS) {
                      cir.setReturnValue(false);
                  }
              }
          }
          EOF

      - name: Inicjalizacja Gradle i kompilacja JAR
        run: |
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew
          ./gradlew build

      - name: Przesylanie gotowego pliku bota
        uses: actions/upload-artifact@v4
        with:
          name: NoPush-AntiBadEffect-JAR
          path: build/libs/*
