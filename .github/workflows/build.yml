name: Kompilator NoPush Fabric 1.21.4
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobieranie projektu
        uses: actions/checkout@v4

      - name: Konfiguracja Javy 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generowanie struktury projektu Fabric
        run: |
          mkdir -p src/main/java/pl/serwer/nopush/mixin
          mkdir -p src/main/resources
          mkdir -p gradle/wrapper

          # Generowanie podstawowych ustawien budowania Gradle
          echo "pluginManagement { repositories { maven { url = 'https://fabricmc.net' }; mavenCentral() } }" > settings.gradle
          echo "org.gradle.jvmargs=-Xmx2G" > gradle.properties

          # Budowanie pliku build.gradle z oficjalnymi mapowaniami Mojangu
          (
          echo "plugins { id 'fabric-loom' version '1.9-SNAPSHOT' }"
          echo "version = '1.0.0'"
          echo "group = 'pl.serwer.nopush'"
          echo "dependencies { minecraft 'com.mojang:minecraft:1.21.4'; mappings loom.officialMojangMappings^(^); modImplementation 'net.fabricmc:fabric-loader:0.16.9' }"
          echo "tasks.withType^(JavaCompile^).configureEach { it.options.release = 21 }"
          echo "java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }"
          ) > build.gradle

          # Tworzenie wrapperow koniecznych do kompilacji bez pobierania skryptow
          echo 'wrapper { gradleVersion = "8.11.1" }' >> build.gradle

      - name: Generowanie plików konfiguracyjnych moda
        run: |
          echo '{"schemaVersion":1,"id":"nopush-doomsday","version":"1.0.0","name":"No Push Doomsday","description":"NoPush z Doomsday.","authors":["Serwer"],"license":"MIT","environment":"client","mixins":["nopush.mixins.json"],"depends":{"fabricloader":">=0.16.9","minecraft":"~1.21.4"}}' > src/main/resources/fabric.mod.json
          echo '{"required":true,"package":"pl.serwer.nopush.mixin","compatibilityLevel":"JAVA_21","client":["LocalPlayerMixin"]}' > src/main/resources/nopush.mixins.json

      - name: Generowanie kodu zrodlowego z Doomsdaya
        run: |
          (
          echo "package pl.serwer.nopush.mixin;"
          echo "import net.minecraft.client.player.LocalPlayer;"
          echo "import org.spongepowered.asm.mixin.Mixin;"
          echo "import org.spongepowered.asm.mixin.injection.At;"
          echo "import org.spongepowered.asm.mixin.injection.Inject;"
          echo "import org.spongepowered.asm.mixin.injection.callback.CallbackInfoReturnable;"
          echo "@Mixin^(LocalPlayer.class^)"
          echo "public class LocalPlayerMixin {"
          echo "    @Inject^(method = \"pushOutOfBlocks\", at = @At^(\"HEAD\"^), cancellable = true^)"
          echo "    private void onPushOutOfBlocks^(double x, double z, CallbackInfoReturnable<Boolean> cir^) {"
          echo "        cir.setReturnValue^(false^);"
          echo "    }"
          echo "}"
          ) > src/main/java/pl/serwer/nopush/mixin/LocalPlayerMixin.java

      - name: Inicjalizacja Gradle i kompilacja JAR
        run: |
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew
          ./gradlew build

      - name: Przesylanie gotowego pliku bota
        uses: actions/upload-artifact@v4
        with:
          name: NoPush-Doomsday-JAR
          path: build/libs/*
